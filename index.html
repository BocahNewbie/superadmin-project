<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Treatment - Panel Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="admin-container" style="max-width: 1300px; margin: 30px auto; padding: 20px;">
        
        <!-- Header Admin -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
            <h2 style="color: #5eead4; margin: 0; font-size: 22px; border: none; padding: 0;">Pendaftaran Treatment - Panel Admin</h2>
            <div style="display: flex; gap: 10px;">
                <button type="button" onclick="downloadExcel()" style="background: #0d9488; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px;">📥 Download Excel (.xls)</button>
                <button type="button" onclick="loadAdminData()" style="background: #475569; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px;">🔄 Refresh Data</button>
            </div>
        </div>

        <!-- Filter / Pencarian -->
        <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
            <input type="text" id="adminSearch" placeholder="🔍 Cari nama / alamat / telepon..." onkeyup="filterAdminTable()" style="flex: 1; min-width: 280px; margin: 0; background: rgba(15, 48, 45, 0.6); border: 1px solid rgba(153, 246, 228, 0.3); color: white; padding: 10px 14px; border-radius: 8px;">
        </div>

        <!-- Tabel Data Utama -->
        <div class="table-responsive" style="background: rgba(13, 40, 38, 0.75); border: 1px solid rgba(153, 246, 228, 0.25); border-radius: 12px; overflow-x: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
                <thead>
                    <tr style="background: rgba(19, 78, 74, 0.9); color: #5eead4; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;">
                        <th style="padding: 12px; text-align: center; width: 50px;">No</th>
                        <th style="padding: 12px;">Timestamp</th>
                        <th style="padding: 12px;">Nama Lengkap</th>
                        <th style="padding: 12px;">Alamat</th>
                        <th style="padding: 12px;">No WhatsApp</th>
                        <th style="padding: 12px;">Tanggal Treatment</th>
                        <th style="padding: 12px;">Jam Treatment</th>
                        <th style="padding: 12px;">Keterangan Pembayaran</th>
                        <th style="padding: 12px; text-align: center; width: 130px;">Aksi</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr><td colspan="9" style="text-align: center; padding: 30px; color: #99f6e4;">Memuat data peserta... ⏳</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Edit Data -->
    <div id="editModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(9, 28, 26, 0.85); backdrop-filter:blur(8px); display:flex; justify-content:center; align-items:center; z-index:9999;">
        <div class="modal-card" style="background: rgba(19, 78, 74, 0.95); border: 1px solid rgba(153, 246, 228, 0.3); padding: 30px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
            <h3 style="color: #ffffff; text-align: center; margin-top: 0; margin-bottom: 20px; font-size: 18px; border-bottom: 1px solid rgba(153,246,228,0.2); padding-bottom: 10px;">✏️ Edit Data Peserta</h3>
            <form id="editForm" onsubmit="saveEditData(event)">
                <input type="hidden" id="editOriginalTelp">
                
                <label style="color: #99f6e4; font-size: 12px; font-weight: 600;">Nama Lengkap</label>
                <input type="text" id="editNama" required style="width: 100%; background: rgba(10,31,29,0.8); border: 1px solid rgba(153,246,228,0.3); color: white; padding: 10px; border-radius: 8px; margin: 5px 0 12px 0;">
                
                <label style="color: #99f6e4; font-size: 12px; font-weight: 600;">Tanggal Treatment</label>
                <select id="editTanggal" required style="width: 100%; background: rgba(10,31,29,0.8); border: 1px solid rgba(153,246,228,0.3); color: white; padding: 10px; border-radius: 8px; margin: 5px 0 12px 0;">
                    <option value="30 Oktober 2026">30 Oktober 2026</option>
                    <option value="31 Oktober 2026">31 Oktober 2026</option>
                    <option value="1 November 2026">1 November 2026</option>
                    <option value="2 November 2026">2 November 2026</option>
                    <option value="3 November 2026">3 November 2026</option>
                </select>
                
                <label style="color: #99f6e4; font-size: 12px; font-weight: 600;">Jam Treatment</label>
                <input type="text" id="editJam" required style="width: 100%; background: rgba(10,31,29,0.8); border: 1px solid rgba(153,246,228,0.3); color: white; padding: 10px; border-radius: 8px; margin: 5px 0 12px 0;">
                
                <label style="color: #99f6e4; font-size: 12px; font-weight: 600;">Keterangan Pembayaran</label>
                <select id="editKeterangan" style="width: 100%; background: rgba(10,31,29,0.8); border: 1px solid rgba(153,246,228,0.3); color: white; padding: 10px; border-radius: 8px; margin: 5px 0 20px 0;">
                    <option value="Belum">Belum</option>
                    <option value="Lunas">Lunas</option>
                </select>

                <div style="display: flex; gap: 10px;">
                    <button type="button" onclick="closeEditModal()" style="background: #475569; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: 600;">Batal</button>
                    <button type="submit" style="background: #0d9488; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: 600;">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
